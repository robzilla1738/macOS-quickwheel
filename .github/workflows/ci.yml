name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: swift test
      - name: Xcode build
        run: xcodebuild -project Quickwheel.xcodeproj -scheme Quickwheel -configuration Debug build
