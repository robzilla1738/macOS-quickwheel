name: Quickwheel
options:
  bundleIdPrefix: com.robertcourson
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  Quickwheel:
    type: application
    platform: macOS
    sources:
      - path: Sources/Quickwheel
      - path: Sources/QuickwheelCore
      - path: Resources/QuickwheelIcon.icns
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Quickwheel
        CFBundleExecutable: Quickwheel
        CFBundleIdentifier: com.robertcourson.quickwheel
        CFBundleIconFile: QuickwheelIcon
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: Quickwheel
        CFBundlePackageType: APPL
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robertcourson.quickwheel
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
schemes:
  Quickwheel:
    build:
      targets:
        Quickwheel: all
    run:
      config: Debug
      executable: Quickwheel
