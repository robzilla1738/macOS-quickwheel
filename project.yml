name: Quickwheel
options:
  bundleIdPrefix: com.robertcourson
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.8.0
targets:
  Quickwheel:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: Sources/Quickwheel
      - path: Sources/QuickwheelCore
      - path: Resources/QuickwheelIcon.icns
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Quickwheel
        CFBundleExecutable: Quickwheel
        CFBundleIdentifier: com.robertcourson.quickwheel
        CFBundleIconFile: QuickwheelIcon
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: Quickwheel
        CFBundlePackageType: APPL
        CFBundleShortVersionString: 0.3.0
        CFBundleVersion: "5"
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSAppleEventsUsageDescription: Quickwheel runs AppleScript actions that you configure, which may control other apps.
        NSHighResolutionCapable: true
        SUEnableAutomaticChecks: true
        SUFeedURL: https://raw.githubusercontent.com/robzilla1738/macOS-quickwheel/main/appcast.xml
        SUPublicEDKey: 3LBPx8Uv5L5ptqRqdCWovmUIPLxcDEPnivy8cOpIlH8=
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robertcourson.quickwheel
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
schemes:
  Quickwheel:
    build:
      targets:
        Quickwheel: all
    run:
      config: Debug
      executable: Quickwheel
